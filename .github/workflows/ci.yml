name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Validate native release workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/release-binaries.yml
      - run: cargo fmt --all -- --check
      - name: Test release preflight checks
        run: scripts/test-release-preflight.sh
      - name: Test release binary build wrapper
        run: scripts/test-build-release-binary.sh
      - name: Test local smoke failure reporting
        run: python3 scripts/test-local-smoke-failures.py
      - name: Test CLI revision watch paths
        run: scripts/test-cli-git-hash-watch.sh
      - name: Check Dockerfile base image pins
        run: scripts/check-dockerfile-base-pins.sh
      - name: Test DefaultPQValidator artifact paths
        run: scripts/test-default-pq-validator-artifacts.sh
      - name: Check DefaultPQValidator artifacts
        run: scripts/default-pq-validator-artifacts.sh --check
      - name: Check workspace lockfile
        run: scripts/check-release-lockfile.sh
      - name: Check workspace crates are private
        run: cargo metadata --no-deps --format-version 1 | jq -e 'all(.packages[]; .publish == [])'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets
      - name: Check transaction generator
        run: cargo check --locked --manifest-path tools/tx-generator/Cargo.toml --all-targets
      - name: Lint production libp2p backend
        run: cargo clippy -p shell-network --features libp2p --all-targets -- -D warnings
      - name: RPC doc drift check
        run: cargo run -p rpc-docgen -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Test durable validator activity RPC
        run: cargo test --locked -p shell-rpc --features rocksdb validator_votes_signed_headers_survive_pruning_reopen_and_canonical_change -- --nocapture
      - run: cargo test --workspace
      - name: Test interactive password fallback
        run: |
          cargo build -p shell-cli --bin shell-node
          python3 scripts/test-password-prompts.py target/debug/shell-node
      - name: Test production libp2p backend
        run: cargo test -p shell-network --features libp2p
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Test epoch recovery, historical state and fee rewards
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p shell-cli --bin shell-node --features libp2p
          consumer="$RUNNER_TEMP/epoch-recovery-sdk"
          runtime="$RUNNER_TEMP/epoch-recovery-runtime"
          mkdir -p "$consumer" "$runtime"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org/ --prefer-online shell-sdk@0.14.0-rc.2
          if ! {
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --epoch-pruned-restart &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-lifecycle.mjs --historical-state &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-lifecycle.mjs --historical-pruned-bodies &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-lifecycle.mjs --fee-history-rewards &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --sync-status &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --block-signers &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --block-signers-sphincs &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --quorum-recovery &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --fork-sync &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --fork-sync-weighted &&
            NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              TMPDIR="$runtime" node tests/e2e/native-aa-registry.mjs --fork-sync-same-height &&
            SHELL_NODE_BIN="$GITHUB_WORKSPACE/target/debug/shell-node" \
              SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js" \
              SHELL_COHORT_RECONFIGURE=1 TMPDIR="$runtime" node tests/e2e/prover-cohort.mjs
          }; then
            for report in "$runtime"/*/runtime.json "$runtime"/*/runtime-result.json; do
              test ! -f "$report" || cat "$report"
            done
            for log in "$runtime"/*/*-node.log "$runtime"/*/runtime/node*.log; do
              test ! -f "$log" || tail -n 100 "$log"
            done
            exit 1
          fi

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Install cargo-deny
        run: |
          source scripts/supply-chain-tool-versions.sh
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Install cargo-audit
        run: |
          source scripts/supply-chain-tool-versions.sh
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Deny check (licenses, bans, advisories)
        run: cargo deny check
      - name: Audit vulnerabilities
        run: cargo audit
      - name: Audit fuzz dependencies
        run: cargo audit --file fuzz/Cargo.lock
      - name: Audit transaction generator dependencies
        run: cargo audit --file tools/tx-generator/Cargo.lock
      - name: Audit patched libp2p-yamux dependencies
        run: cargo audit --file deps/libp2p-yamux/Cargo.lock
