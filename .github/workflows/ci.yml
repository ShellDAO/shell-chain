name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo fmt --all -- --check
      - name: Test release preflight checks
        run: scripts/test-release-preflight.sh
      - name: Test release binary build wrapper
        run: scripts/test-build-release-binary.sh
      - name: Test CLI revision watch paths
        run: scripts/test-cli-git-hash-watch.sh
      - name: Check DefaultPQValidator artifacts
        run: scripts/default-pq-validator-artifacts.sh --check
      - name: Check workspace crates are private
        run: cargo metadata --no-deps --format-version 1 | jq -e 'all(.packages[]; .publish == [])'
      - run: cargo clippy --workspace -- -D warnings
      - name: Check fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets
      - name: Check transaction generator
        run: cargo check --locked --manifest-path tools/tx-generator/Cargo.toml --all-targets
      - name: Lint production libp2p backend
        run: cargo clippy -p shell-network --features libp2p --all-targets -- -D warnings
      - name: RPC doc drift check
        run: cargo run -p rpc-docgen -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo test --workspace
      - name: Test production libp2p backend
        run: cargo test -p shell-network --features libp2p

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Install cargo-deny
        run: |
          source scripts/supply-chain-tool-versions.sh
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Install cargo-audit
        run: |
          source scripts/supply-chain-tool-versions.sh
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Deny check (licenses, bans, advisories)
        run: cargo deny check
      - name: Audit vulnerabilities
        run: cargo audit
      - name: Audit fuzz dependencies
        run: cargo audit --file fuzz/Cargo.lock
      - name: Audit transaction generator dependencies
        run: cargo audit --file tools/tx-generator/Cargo.lock
      - name: Audit patched libp2p-yamux dependencies
        run: cargo audit --file deps/libp2p-yamux/Cargo.lock
