name: PQ-HD native release acceptance
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed node source commit
        required: true
        type: string
      mode:
        description: Verify produced artifacts or anonymous public downloads
        required: true
        type: choice
        options: [produced, public]
      build_run:
        description: Successful production binary workflow run
        required: true
        type: string
        default: '40041095469'
      archive_sha256:
        description: Independently verified Linux archive checksum
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  accept:
    name: Accept Linux PQ-HD recovery archive
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Verify exact native archive and source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          MODE: ${{ inputs.mode }}
          BUILD_RUN: ${{ inputs.build_run }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = 7b6304fd7a31fedc3ff8d11294e5381cb97b1758
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/native"
          if [ "$MODE" = produced ]; then
            gh run view "$BUILD_RUN" --repo ShellDAO/shell-chain \
              --json headSha,status,conclusion,workflowName > "$RUNNER_TEMP/production-run.json"
            python3 - "$RUNNER_TEMP/production-run.json" <<'PYTHON'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          assert run['headSha'] == os.environ['SOURCE_COMMIT']
          assert run['workflowName'] == 'Release binaries'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          PYTHON
            gh run download "$BUILD_RUN" --repo ShellDAO/shell-chain \
              --name release-x86_64-unknown-linux-gnu --dir "$RUNNER_TEMP/native"
          else
            test "$MODE" = public
            curl --fail --location --retry 2 --output "$RUNNER_TEMP/native/SHA256SUMS" \
              https://github.com/ShellDAO/shell-chain/releases/download/v0.27.13/SHA256SUMS
            curl --fail --location --retry 2 \
              --output "$RUNNER_TEMP/native/shell-node-v0.27.13-x86_64-unknown-linux-gnu.tar.gz" \
              https://github.com/ShellDAO/shell-chain/releases/download/v0.27.13/shell-node-v0.27.13-x86_64-unknown-linux-gnu.tar.gz
          fi
          python3 - "$RUNNER_TEMP/native" <<'PYTHON'
          import hashlib, json, os, pathlib, sys, tarfile
          directory = pathlib.Path(sys.argv[1])
          name = 'shell-node-v0.27.13-x86_64-unknown-linux-gnu.tar.gz'
          archive = directory / name
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert digest == os.environ['ARCHIVE_SHA256']
          assert f'{digest}  {name}' in (directory / 'SHA256SUMS').read_text().splitlines()
          if os.environ['MODE'] == 'produced':
              build = json.loads((directory / 'build.json').read_text())
              assert build['commit'] == os.environ['SOURCE_COMMIT']
              assert build['target'] == 'x86_64-unknown-linux-gnu'
              assert set(build['features']) == {'rocksdb', 'libp2p'}
              assert build['archive'] == name and build['sha256'] == digest
          with tarfile.open(archive) as package:
              members = package.getmembers()
              assert len(members) == 1 and members[0].name == 'shell-node' and members[0].isfile()
              (directory / 'shell-node').write_bytes(package.extractfile(members[0]).read())
          (directory / 'shell-node').chmod(0o755)
          PYTHON
      - name: Recover and reload fresh encrypted wallets
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/pq-hd-sdk"
          mkdir "$consumer"
          echo '{"private":true}' > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org/ --prefer-online shell-sdk@0.14.0-rc.3
          export NODE_BIN="$RUNNER_TEMP/native/shell-node"
          export SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js"
          export PQ_HD_REPORT="$RUNNER_TEMP/pq-hd-report.json"
          node --check scripts/accept-pq-hd-release.mjs
          node scripts/accept-pq-hd-release.mjs
      - name: Retain public acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pq-hd-${{ inputs.mode }}-linux-0.27.13
          path: |
            ${{ runner.temp }}/pq-hd-report.json
            ${{ runner.temp }}/native/SHA256SUMS
            ${{ runner.temp }}/native/build.json
          if-no-files-found: warn
          retention-days: 7
