name: Release binaries

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed main commit to build (full 40-character SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_BUILD_JOBS: '2'
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Validate the exact release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain)"
          scripts/check-release-remote.sh origin
          scripts/check-release-ci.sh "$RELEASE_COMMIT"
          scripts/check-release-metadata.sh
          scripts/check-release-lockfile.sh
          cargo fmt --all -- --check
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RELEASE_TARGET"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev cmake pkg-config
          else
            brew list llvm >/dev/null 2>&1 || brew install llvm
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi

      - name: Build and package the production binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/release-target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET=13.0
          fi
          scripts/build-release-binary.sh
          test -z "$(git status --porcelain)"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          report=$("$CARGO_TARGET_DIR/release/shell-node" version 2>&1)
          grep -Fx "shell-cli $version" <<< "$report"
          grep -Fx "  commit: $(git rev-parse --short HEAD)" <<< "$report"
          mkdir "$RUNNER_TEMP/release-assets"
          archive="$RUNNER_TEMP/release-assets/shell-node-v${version}-${RELEASE_TARGET}.tar.gz"
          tar -czf "$archive" -C "$CARGO_TARGET_DIR/release" shell-node
          python3 - "$archive" <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          archive = pathlib.Path(sys.argv[1])
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          (archive.parent / 'SHA256SUMS').write_text(f'{digest}  {archive.name}\n')
          evidence = {
              'commit': os.environ['RELEASE_COMMIT'],
              'target': os.environ['RELEASE_TARGET'],
              'archive': archive.name,
              'sha256': digest,
              'features': ['rocksdb', 'libp2p'],
              'rustc': subprocess.check_output(['rustc', '-vV'], text=True),
              'platform': platform.platform(),
              'macos_deployment_target': os.environ.get('MACOSX_DEPLOYMENT_TARGET'),
          }
          (archive.parent / 'build.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Upload verified native archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
