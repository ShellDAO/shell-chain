name: Release binary acceptance
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed acceptance source commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  accept:
    name: Accept public Linux quorum recovery archive
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Verify and test the existing release archive
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT=8bbf31da1e16949f5d0adf82820692fb003b3e4c
          test "$SOURCE_COMMIT" = 8bbf31da1e16949f5d0adf82820692fb003b3e4c
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir "$RUNNER_TEMP/native"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/native/SHA256SUMS" https://github.com/ShellDAO/shell-chain/releases/download/v0.27.10/SHA256SUMS
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/native/shell-node-v0.27.10-x86_64-unknown-linux-gnu.tar.gz" https://github.com/ShellDAO/shell-chain/releases/download/v0.27.10/shell-node-v0.27.10-x86_64-unknown-linux-gnu.tar.gz
          python3 - "$RUNNER_TEMP/native" <<'PYTHON'
          import hashlib, pathlib, sys, tarfile
          directory = pathlib.Path(sys.argv[1])
          name = 'shell-node-v0.27.10-x86_64-unknown-linux-gnu.tar.gz'
          archive = directory / name
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert digest == 'b1a1dcbbe740a7c0e9f9009a09e4ca276e2219824c1a82a898b2118e9bd072f8'
          assert f'{digest}  {name}' in (directory / 'SHA256SUMS').read_text().splitlines()
          with tarfile.open(archive) as package:
              entries = package.getmembers()
              assert len(entries) == 1 and entries[0].name == 'shell-node' and entries[0].isfile()
              (directory / 'shell-node').write_bytes(package.extractfile(entries[0]).read())
          (directory / 'shell-node').chmod(0o755)
          PYTHON
          report=$("$RUNNER_TEMP/native/shell-node" version 2>&1)
          grep -Fx 'shell-cli 0.27.10' <<< "$report"
          grep -Fx '  commit: 8bbf31da' <<< "$report"
          consumer="$RUNNER_TEMP/block-signers-sdk"
          export TMPDIR="$RUNNER_TEMP/acceptance-runtime"
          mkdir "$consumer" "$TMPDIR"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --prefer-online shell-sdk@0.14.0-rc.2
          export NODE_BIN="$RUNNER_TEMP/native/shell-node"
          export SHELL_SDK_ENTRY="$consumer/node_modules/shell-sdk/dist/index.js"
          node --check tests/e2e/native-aa-registry.mjs
          node tests/e2e/native-aa-registry.mjs --quorum-recovery
      - name: Retain acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-public-quorum-acceptance
          path: |
            ${{ runner.temp }}/acceptance-runtime/**/runtime.json
            ${{ runner.temp }}/acceptance-runtime/**/*.log
          if-no-files-found: warn
          retention-days: 7
