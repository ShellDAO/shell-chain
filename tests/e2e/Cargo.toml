[package]
name = "shell-e2e-tests"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[lib]
name = "shell_e2e"
path = "common.rs"

[[test]]
name = "smoke_test"
path = "smoke_test.rs"

[[test]]
name = "stress_test"
path = "stress_test.rs"

[[test]]
name = "sync_test"
path = "sync_test.rs"

[[test]]
name = "wpoa_regression"
path = "wpoa_regression.rs"

[[test]]
name = "throughput_test"
path = "throughput_test.rs"

[[test]]
name = "aa_batch_test"
path = "aa_batch_test.rs"

[[test]]
name = "aa_sponsored_test"
path = "aa_sponsored_test.rs"

# aa_paymaster_gas_test requires a full PQVM executor + contract bytecode fixtures.
# Compile and run only with: cargo test -p shell-e2e-tests --features pqvm-e2e --test aa_paymaster_gas_test
[[test]]
name = "aa_paymaster_gas_test"
path = "aa_paymaster_gas_test.rs"
required-features = ["pqvm-e2e"]

[features]
# Gate tests that require a full PQVM executor and deployed contract bytecode.
pqvm-e2e = []

[dependencies]
shell-primitives = { path = "../../crates/primitives" }
shell-crypto = { path = "../../crates/crypto" }
shell-core = { path = "../../crates/core" }
shell-storage = { path = "../../crates/storage" }
shell-mempool = { path = "../../crates/mempool" }
shell-rpc = { path = "../../crates/rpc" }
shell-consensus = { path = "../../crates/consensus" }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
hex = "0.4"
serde_json = "1"
