[workspace]
resolver = "2"
members = [
    "crates/primitives",
    "crates/crypto",
    "crates/core",
    "crates/storage",
    "crates/consensus",
    "crates/genesis",
    "crates/evm",
    "crates/mempool",
    "crates/rpc",
    "crates/network",
    "crates/node",
    "crates/keystore",
    "crates/cli",
    "crates/stark-prover",
    "tests/e2e",
    "crates/bench",
    "tools/load-test",
    "tools/stark-bench",
    "tools/multi-prover-test",
    "tools/rpc-docgen",
]

[workspace.package]
version = "0.23.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LucienSong/shell-chain"

[workspace.dependencies]
# --- primitives ---
alloy-primitives = { version = "1.5", features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3", features = ["derive"] }
sha3 = "0.10"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"

# --- crypto ---
shell-primitives = { path = "crates/primitives" }
shell-crypto = { path = "crates/crypto" }
shell-core = { path = "crates/core" }
shell-storage = { path = "crates/storage" }
shell-consensus = { path = "crates/consensus" }
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"
fips204 = "0.4.6"
zeroize = { version = "1", features = ["derive"] }

# --- keystore ---
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.9"

# --- consensus ---
async-trait = "0.1"

# --- storage (trie) ---
eth_trie = "0.4"

# --- evm ---
revm = { version = "36", default-features = false, features = ["std", "optional_no_base_fee", "optional_balance_check"] }

# --- rpc ---
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
tower = { version = "0.4", features = ["limit", "timeout", "buffer"] }
tower-http = { version = "0.5", features = ["cors", "validate-request"] }
http = "1"
futures-util = "0.3"

# --- network (libp2p) ---
libp2p = { version = "0.56", features = ["tcp", "dns", "noise", "yamux", "gossipsub", "mdns", "tokio", "identify", "kad", "macros", "relay", "dcutr", "autonat"] }

# --- storage (rocksdb) ---
rocksdb = { version = "0.22", default-features = false, features = ["snappy", "zstd"] }

# --- tls ---
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", features = ["ring"] }

# --- cli ---
clap = { version = "4", features = ["derive"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rpassword = "7"

# --- metrics ---
prometheus = "0.14"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# --- parallel ---
rayon = "1.10"

# --- caching ---
lru = "0.16"

# --- benchmarks ---
criterion = { version = "0.5", features = ["html_reports"] }

# --- stark prover (Phase C) ---
winterfell = "0.13"

[patch.crates-io]
ark-relations = { path = "deps/ark-relations" }
libp2p-yamux = { path = "deps/libp2p-yamux" }

[workspace.metadata.audit]
ignore = [
    # hickory-proto NSEC3 closest-encloser proof validation has no fixed release yet.
    "RUSTSEC-2026-0118",
    # hickory-proto CPU exhaustion remains transitive through libp2p 0.56 and
    # there is no compatible crates.io upgrade path in this workspace yet.
    "RUSTSEC-2026-0119",
]

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.test]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
strip = "debuginfo"
