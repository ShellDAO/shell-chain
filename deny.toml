[advisories]
# Deny crates with known security advisories.
ignore = []
# Unmaintained crates: "none" skips the check (use "workspace" or "all" to enable).
unmaintained = "none"

[licenses]
# Allow only standard permissive/copyleft licenses suitable for open-source use.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
]
# Copyleft licenses that require review before adding new crates.
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
# Allow dual-licensed crates where at least one license is permitted.
exceptions = []

[bans]
# Deny exact duplicate versions of the same crate (except where explicitly
# skipped) to reduce supply-chain attack surface.
multiple-versions = "warn"
wildcards = "deny"
# Crates that must never appear in the dependency tree.
deny = []
# Allow multiple versions of these commonly duplicated crates.
skip = [
    { name = "syn", version = "1" },
    { name = "syn", version = "2" },
]
skip-tree = []

[sources]
# Only allow crates from crates.io and our own git sources.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
