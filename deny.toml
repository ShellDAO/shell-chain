[advisories]
# Deny crates with known security advisories.
ignore = [
    # H-4 (audit finding 2026-05-24): hickory-proto 0.25.2 pulled transitively
    # by libp2p 0.56.  A patched version (>=0.26.1) exists on crates.io but
    # libp2p has not yet published a release that accepts it, so we cannot bump
    # without forking libp2p or waiting for an upstream libp2p release.
    #
    # Mitigation: hickory-proto/hickory-resolver are used by libp2p ONLY for
    # DNS-based peer bootstrap (mDNS + DNS/SD).  The failure mode is a
    # bootstrap stall — DNS resolution returns an error and the node falls back
    # to known static peers.  There is NO data-integrity or remote-code-execution
    # exposure for shell-chain: DNS results are not persisted, not used in
    # consensus, and not accessible from the contract execution layer.
    # This acceptance will be removed once libp2p ships a compatible release.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
]
# Unmaintained crates: "none" skips the check (use "workspace" or "all" to enable).
unmaintained = "none"

[licenses]
# Allow only standard permissive/copyleft licenses suitable for open-source use.
# Anything not in this list is implicitly denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Warn on duplicate crate versions; warn on wildcard version requirements
# (workspace = true deps appear as wildcards in member Cargo.toml files).
multiple-versions = "warn"
wildcards = "warn"
# Crates that must never appear in the dependency tree.
deny = []
skip = []
skip-tree = []

[sources]
# Only allow crates from crates.io and our own git sources.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
