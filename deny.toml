[advisories]
# Deny crates with known security advisories.
ignore = [
    # Transitive through alloy/libp2p networking dependencies. No active
    # vulnerability is reported; keep visible until upstreams remove `paste`.
    "RUSTSEC-2024-0436",
    # Legacy pre-FIPS Dilithium support is retained for historical key and
    # signature verification compatibility. New signing paths should prefer
    # ML-DSA (`fips204`) while this compatibility path is migrated out.
    "RUSTSEC-2024-0380",
    # SPHINCS+ support is still exposed as a configured PQ signature option.
    # Keep this explicit until a maintained SLH-DSA implementation replaces it.
    "RUSTSEC-2026-0160",
    # Shared pqcrypto support crates pulled by the retained legacy PQ backends.
    "RUSTSEC-2026-0162",
    "RUSTSEC-2026-0163",
    # Direct TLS PEM parsing dependency in shell-rpc. No active vulnerability is
    # reported; track upstream replacement before removing the exception.
    "RUSTSEC-2025-0134",
]
# Check the full dependency tree for unmaintained advisories. Each current
# exception above is explicit and should be removed when upstream migrations
# are available.
unmaintained = "all"

[licenses]
# Allow only standard permissive/copyleft licenses suitable for open-source use.
# Anything not in this list is implicitly denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Warn on duplicate crate versions; warn on wildcard version requirements
# (workspace = true deps appear as wildcards in member Cargo.toml files).
multiple-versions = "warn"
wildcards = "warn"
# Crates that must never appear in the dependency tree.
deny = []
skip = []
skip-tree = []

[sources]
# Only allow crates from crates.io and our own git sources.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
