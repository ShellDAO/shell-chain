[package]
name = "shell-stark-bench"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "Long-running STARK block-compression performance benchmark for Shell-chain"
publish = false

[[bin]]
name = "shell-stark-bench"
path = "src/main.rs"

[dependencies]
shell-stark-prover = { path = "../../crates/stark-prover" }

clap       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow     = "1"
csv        = "1"
hdrhistogram = "7"
chrono     = { version = "0.4", features = ["serde"] }
rand       = "0.8"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo    = "0.29"
