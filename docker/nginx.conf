# Nginx reverse proxy for Shell Chain alpha testnet RPC endpoint.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # --- Rate limiting ---
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=20r/s;

    # --- CORS origin allowlist ---
    # Add your production domain(s) below. Only matched origins receive CORS headers.
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        # Uncomment and edit for your production domain:
        # "~^https?://(.*\.)?shell\.xyz$" $http_origin;
    }

    # --- Logging ---
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json_combined;

    # --- Timeouts for long-polling (eth_subscribe, etc.) ---
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;

    # --- Upstream ---
    upstream rpc_backend {
        server rpc-node:8545;
    }

    upstream metrics_backend {
        server rpc-node:9090;
    }

    # --- TLS Configuration (uncomment when certs are available) ---
    # To enable TLS with Let's Encrypt:
    #   1. Install certbot on the host
    #   2. Run: certbot certonly --standalone -d testnet.shell.xyz
    #   3. Uncomment the ssl_* directives below
    #   4. Mount certs volume: /etc/letsencrypt:/etc/letsencrypt:ro
    #   5. Restart nginx
    #
    # server {
    #     listen 443 ssl;
    #     server_name testnet.shell.xyz;
    #
    #     ssl_certificate /etc/letsencrypt/live/testnet.shell.xyz/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/testnet.shell.xyz/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # Include the location blocks from the HTTP server below.
    # }

    server {
        listen 80;
        server_name _;

        # --- Health check ---
        location /health {
            proxy_pass http://metrics_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # --- JSON-RPC endpoint ---
        location / {
            limit_req zone=rpc_limit burst=40 nodelay;

            # CORS headers — $cors_origin is empty for non-allowlisted origins,
            # which causes the browser to block the cross-origin request as intended.
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://rpc_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- WebSocket endpoint ---
        location /ws {
            limit_req zone=rpc_limit burst=10 nodelay;

            proxy_pass http://rpc_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
