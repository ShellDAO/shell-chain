[package]
name = "shell-stark-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "STARK-based aggregate proof for PQ (Dilithium3) signature batches"

[dependencies]
winterfell.workspace = true
blake3 = { workspace = true }
shell-crypto = { path = "../crypto" }
shell-core = { path = "../core" }
shell-primitives = { path = "../primitives" }
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Enable the real recursive (L2) prover implementation.
# Off by default — the scaffold boundary is always compiled in so that
# ProverService can reason about L2 status without linking the full prover.
recursive = []

[dev-dependencies]
criterion = { workspace = true }
