[package]
name = "shell-stark-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "STARK-based aggregate proof for PQ (Dilithium3) signature batches"

[dependencies]
winterfell.workspace = true
blake3 = { workspace = true }
shell-crypto = { path = "../crypto" }
shell-core = { path = "../core" }
shell-primitives = { path = "../primitives" }
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ciborium = "0.2.2"
alloy-rlp.workspace = true
shell-storage = { path = "../storage" }

[features]
# Enable the real recursive (L2) prover implementation.
# Off by default — the scaffold boundary is always compiled in so that
# ProverService can reason about L2 status without linking the full prover.
recursive = []

[dev-dependencies]
sha2 = { version = "0.10.9", features = ["compress"] }
shell-consensus.workspace = true
shell-pqvm = { path = "../pqvm" }
shell-storage = { path = "../storage", features = ["rocksdb"] }
sha3 = { workspace = true }
criterion = { workspace = true }
