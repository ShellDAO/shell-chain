[package]
name = "shell-crypto"
description = "Post-quantum cryptography for Shell-Chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["batch"]
batch = ["rayon"]

[dependencies]
shell-primitives = { workspace = true }
pqcrypto-dilithium = { workspace = true }
pqcrypto-sphincsplus = { workspace = true }
pqcrypto-traits = { workspace = true }
fips204 = { workspace = true }
zeroize = { workspace = true }
alloy-rlp = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
sha3 = { workspace = true }

[[bench]]
name = "crypto_bench"
harness = false

[[bin]]
name = "gen_mldsa_vectors"
path = "src/bin/gen_mldsa_vectors.rs"
required-features = []

[[bin]]
name = "gen_dilithium3_tx_fixtures"
path = "src/bin/gen_dilithium3_tx_fixtures.rs"
required-features = []
